apiVersion: v1
kind: Secret
metadata:
  name: {{ .Name }}-s3-credentials
  namespace: {{ .Namespace }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "{{ .AccessKey }}"
  AWS_SECRET_ACCESS_KEY: "{{ .SecretKey }}"
  S3_ENDPOINT: "{{ .Endpoint }}"
  S3_REGION: "{{ .Region }}"
  S3_BUCKET: "{{ .Bucket }}"
