apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ .StoreName }}
  namespace: {{ .Namespace }}
spec:
  provider:
    vault:
      server: "{{ .VaultAddress }}"
      path: "secret"
      version: "v2"
      auth:
        tokenSecretRef:
          name: vault-token
          key: token
