apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Name }}-secrets
  namespace: {{ .Namespace }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: {{ .StoreName }}
    kind: SecretStore
  target:
    name: {{ .Name }}-env
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ .Name }}/credentials
        property: password
