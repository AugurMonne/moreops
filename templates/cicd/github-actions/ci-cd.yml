name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build MoreOps
        run: make build
      - name: Validate
        run: ./bin/moreops validate
      - name: Security Scan
        run: ./bin/moreops scan fs
      - name: Apply
        if: github.ref == 'refs/heads/main'
        run: ./bin/moreops apply --yes
