version: "1.0"
name: enterprise-fullstack
description: Full-stack production architecture orchestrating K8s, Vault, MinIO/S3, Prometheus, and Argo CD

build:
  language: go
  port: 8080
  dockerfile: Dockerfile

deploy:
  type: helm
  replicas: 3
  resources:
    cpu_limit: "1000m"
    memory_limit: "1Gi"
    cpu_request: "250m"
    memory_request: "256Mi"
  ingress:
    enabled: true
    host: fullstack.enterprise.io
    path: /

monitoring:
  enabled: true
  path: /metrics
  interval: 15s
  alerts_enabled: true
  grafana_dashboard: "1"

security:
  run_as_non_root: true
  read_only_root_filesystem: true
  allow_privilege_escalation: false
  vault_enabled: true
  vault_provider: in-cluster-dev
  vault_address: http://vault.vault.svc.cluster.local:8200
  vault_role: enterprise-fullstack
  secret_path: secret/data/fullstack

storage:
  s3_provider: minio
  bucket_name: app-assets
  endpoint: http://minio.minio.svc.cluster.local:9000
  backup_schedule: "0 3 * * *"

environments:
  dev:
    deploy:
      replicas: 1
    monitoring:
      interval: 30s
  staging:
    deploy:
      replicas: 2
  prod:
    deploy:
      replicas: 5
