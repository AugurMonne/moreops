version: "1.0"
name: python-api
description: Python Flask API example managed by MoreOps

build:
  language: python
  version: "3.11"
  port: 8000
  dockerfile: Dockerfile

deploy:
  type: helm
  replicas: 2
  resources:
    cpu_limit: "500m"
    memory_limit: "256Mi"
    cpu_request: "100m"
    memory_request: "64Mi"
  ingress:
    enabled: true
    host: python-api.local
    path: /

monitoring:
  enabled: true
  path: /metrics
  interval: 15s

security:
  run_as_non_root: true
  read_only_root_filesystem: true
  allow_privilege_escalation: false
