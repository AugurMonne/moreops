version: "1.0"
name: s3-backup-app
description: Cloud-native application configured with Velero & S3 backup policies

build:
  language: go
  port: 8080

deploy:
  type: helm
  replicas: 1

storage:
  s3_provider: yandex
  bucket_name: moreops-backups-bucket
  region: ru-central1
  endpoint: https://storage.yandexcloud.net
  backup_schedule: "0 2 * * *"
  backup_retention: "720h"

security:
  run_as_non_root: true
  read_only_root_filesystem: true
  allow_privilege_escalation: false
