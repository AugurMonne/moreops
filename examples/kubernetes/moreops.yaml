version: "1.0"
name: k8s-production-app
description: Production-grade Kubernetes deployment using Kustomize and MoreOps

build:
  language: go
  port: 8080

deploy:
  type: kustomize
  replicas: 3
  resources:
    cpu_limit: "1000m"
    memory_limit: "1Gi"
    cpu_request: "250m"
    memory_request: "256Mi"
  ingress:
    enabled: true
    host: prod-service.example.com
    path: /

security:
  run_as_non_root: true
  read_only_root_filesystem: true
  allow_privilege_escalation: false
  drop_capabilities:
    - ALL
